[build-system]
requires = ["setuptools>=60", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "dl-backtrace"
description = "Deep learning backtracing and explainability toolkit"
readme = "README.md"

dependencies = [
    "torch==2.6.0 @ https://download.pytorch.org/whl/cu126",
    "transformers==4.52.3",
    "huggingface-hub",
    "lz4",
    "matplotlib",
    "seaborn",
    "threadpoolctl",
    "ninja",
    "ipykernel",
    "ipywidgets",
    "joblib",
    "zstandard",
    "graphviz",
    "tqdm",
    "scikit-image",
    "lime",
    "tensorflow"
]

[tool.setuptools_scm]
version_scheme = "guess-next-dev"
local_scheme = "no-local-version"
write_to = "dl_backtrace/version.py"
