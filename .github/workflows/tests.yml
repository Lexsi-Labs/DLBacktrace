name: Tests

on:
  pull_request:
    branches: [dlb_v2]
  push:
    branches: [dlb_v2]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "transformers>=4.52.3,<4.53" pytest fastapi httpx uvicorn lz4 matplotlib seaborn threadpoolctl ninja joblib zstandard tqdm scikit-image graphviz ipython ipykernel ipywidgets lime scikit-learn
      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest tests -q
